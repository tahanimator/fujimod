[package]
name = "fujimod-xe2-capture"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
license.workspace = true
description = "Local X-E2 4.11 service-mode state capture and RAM-only flash backup with a dry run"
build = "build.rs"

[lib]
doctest = false

[[bin]]
name = "fujimod-xe2-capture"
path = "src/main.rs"
test = false

[dependencies]
fujimod-usb.workspace = true
fujimod-catalog.workspace = true
fujimod-catalog-bulk.workspace = true
fujimod-workflows.workspace = true
fujimod-workspace-hack.workspace = true
futures-lite.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[build-dependencies]
serde_json.workspace = true
sha2.workspace = true
